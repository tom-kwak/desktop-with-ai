name: ReviewDesk CI

# Checks changes on their way to develop and main. It stands in for the upstream
# CI workflow, which needs runners this repository doesn't have.
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: reviewdesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, lint and test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Check formatting
        run: npm run prettier
      - name: Lint
        run: npm run lint:src
      - name: Test
        run: npm test -- app/test/unit
