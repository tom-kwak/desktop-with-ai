name: ReviewDesk release

# Builds the macOS app and attaches it to a GitHub release, which is where the
# download page links to. Push a tag such as release-v1.0.2 to run it. The tag
# has to be on a commit that is on main: only what has been merged into main is
# released.
on:
  push:
    tags:
      - 'release-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Apple Silicon, which is what the app is built for.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # Not 'production': that channel would need Apple signing, and would make
      # the app update itself to the official GitHub Desktop.
      RELEASE_CHANNEL: development
    steps:
      - name: Check that the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "identical" or "behind" means the commit is main or one of its
          # ancestors; "ahead" and "diverged" mean it isn't on main.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          echo "$GITHUB_REF_NAME compared to main: $status"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Merge the commit into main and tag it there."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn
      - run: yarn build:prod
      - run: yarn package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ReviewDesk-arm64.zip \
            --title "ReviewDesk ${GITHUB_REF_NAME#release-v}" \
            --notes "macOS, Apple Silicon. See the download page for how to install it."
